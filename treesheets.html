<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <script src="member-gate.js"></script>
    <style>html.gated, html.gated body { overflow: hidden !important; }</style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TreeSheets - Data Tools</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #121214;
      --surface: #1a1a1e;
      --surface-raised: #25252b;
      --border: #383842;
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, .22);
      --cell-background: #111113;
      font: 14px/1.45 "Segoe UI", sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --background: #f6f7f9;
      --surface: #fff;
      --surface-raised: #eef1f5;
      --border: #d7dbe1;
      --text: #1f2328;
      --muted: #626b76;
      --cell-background: #fff;
      --accent-soft: rgba(59, 130, 246, .18);
    }

    :root[data-theme="black"] {
      --background: #000;
      --surface: #050505;
      --surface-raised: #111;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --cell-background: #000;
    }

    * { box-sizing: border-box; }
    body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; color: var(--text); background: var(--background); }
    button, input, select, textarea { color: inherit; font: inherit; }
    button, select { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 4px; }
    button { cursor: pointer; padding: 4px 7px; }
    button:hover { border-color: var(--accent); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); }

    #app { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #work-area { display: flex; flex: 1; min-height: 0; position: relative; }
    #workspace { flex: 1; overflow: auto; padding: 24px; outline: none; }
    #tree-scale { display: inline-block; transform-origin: top left; }
    #grid-root { display: inline-block; padding: 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); box-shadow: 0 12px 35px #0003; }
    .grid { display: grid; align-items: stretch; width: max-content; gap: var(--gap-v) var(--gap-h); }
    .grid.child-grid { max-width: 100%; overflow: auto; padding: 3px; border: 1px solid var(--border); border-radius: 4px; background: color-mix(in srgb, var(--surface) 90%, transparent); box-shadow: inset 0 1px 5px #0002; }
    .cell { position: relative; display: flex; flex-direction: column; min-width: 1px; overflow: auto; background: var(--cell-background); border: 1px solid var(--border); border-radius: 3px; padding: var(--cell-pad-v) var(--cell-pad-h); white-space: pre-wrap; overflow-wrap: anywhere; cursor: default; outline: none; }
    .cell.no-grid-lines { border-color: transparent; }
    .cell.active { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 2; }
    .cell.selected { background: var(--accent-soft); border-color: #3b82f699; }
    .cell.drag-target { background: #1e3a5f; }
    .cell.drag-target.cut { background: #4a1717; }
    .cell.drag-target.copy { background: #123e2b; }
    .cell-text { max-width: var(--textbox-max-width, none); min-width: 0; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; padding: 0 2px; }
    .cell textarea { box-sizing: border-box; width: 100%; max-width: var(--textbox-max-width, none); min-width: 0; min-height: 38px; overflow: auto; resize: vertical; padding: 5px; border: 1px solid #10b981; border-radius: 3px; background: var(--surface); outline: none; line-height: 1.5; overflow-wrap: anywhere; }
    .hidden-marker { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
    .gap { grid-column: 1 / -1; height: 6px; margin: 1px 0; border-radius: 5px; background: transparent; cursor: pointer; }
    .gap:hover, .gap.active { background: #3b82f680; }
    .gap-column { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--accent); pointer-events: none; }
    .drop-edge { position: absolute; z-index: 5; background: var(--accent); pointer-events: none; }
    .drop-edge.row-before, .drop-edge.row-after { left: 0; right: 0; height: 4px; }
    .drop-edge.row-before { top: -2px; }
    .drop-edge.row-after { bottom: -2px; }
    .drop-edge.col-before, .drop-edge.col-after { top: 0; bottom: 0; width: 4px; }
    .drop-edge.col-before { left: -2px; }
    .drop-edge.col-after { right: -2px; }

    #help-panel { width: 320px; flex: 0 0 auto; display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--border); background: var(--surface); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; padding: 8px; background: var(--surface-raised); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; }
    .help-content { overflow: auto; padding: 12px; color: var(--muted); font-size: 12px; }
    .help-content section { padding: 0 0 10px; margin: 0 0 10px; border-bottom: 1px solid var(--border); }
    .help-content h2 { margin: 0 0 4px; color: var(--text); font-size: 13px; }
    .help-content ul { margin: 0; padding-left: 18px; }
    .help-content li { margin: 3px 0; }
    .help-content strong { color: var(--text); }

    #toolbar { position: absolute; top: 0; right: 320px; z-index: 10; width: 224px; max-height: calc(100% - 12px); overflow: hidden; border: 1px solid var(--border); border-radius: 6px; background: color-mix(in srgb, var(--surface) 96%, transparent); box-shadow: 0 10px 30px #0005; }
    #toolbar-header { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; background: var(--surface-raised); border-bottom: 1px solid var(--border); cursor: grab; user-select: none; }
    #toolbar-header:active { cursor: grabbing; }
    #toolbar-body { display: grid; gap: 8px; max-height: calc(100vh - 95px); overflow: auto; padding: 7px; font-size: 11px; }
    .tool-section { display: grid; gap: 5px; padding-top: 6px; border-top: 1px solid var(--border); }
    .tool-section:first-child { padding-top: 0; border-top: 0; }
    .section-title { color: var(--muted); font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .button-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .button-row button, .tool-section > button { font-size: 10px; }
    .tool-section > button { width: 100%; }
    .tool-checks { display: grid; gap: 5px; padding: 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-raised); }
    .tool-checks label { display: flex; align-items: center; gap: 5px; }
    .slider-control { display: grid; gap: 2px; padding: 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-raised); }
    .slider-label { display: flex; justify-content: space-between; color: var(--muted); }
    #footer { display: flex; justify-content: space-between; gap: 12px; padding: 5px 10px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--border); font-size: 11px; }
    #mode-indicator { padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    #mode-indicator.move { color: #60a5fa; }
    #mode-indicator.cut { color: #f87171; }
    #mode-indicator.copy { color: #34d399; }
    .file-button { display: flex; justify-content: center; align-items: center; min-height: 26px; padding: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-raised); cursor: pointer; }
    .file-button input { display: none; }

    @media (max-width: 760px) {
      #workspace { padding: 12px; }
      #help-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(82vw, 320px) !important; z-index: 8; box-shadow: -10px 0 28px #0004; }
      #toolbar { right: 0; width: min(224px, 58vw); }
      #footer { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="work-area">
      <main id="workspace" tabindex="0">
        <div id="tree-scale"><div id="grid-root"></div></div>
      </main>
      <aside id="help-panel"></aside>
      <section id="toolbar" aria-label="TreeSheets controls"></section>
    </div>
    <footer id="footer"></footer>
  </div>

  <script>
    const state = {
      root: { rows: [{ cells: [{ text: "hello", subgrid: { rows: [{ cells: [{ text: "how are you", subgrid: null, childrenHidden: false }] }] }, childrenHidden: false }] }] },
      activePath: "root_r0c0",
      selectedPaths: new Set(["root_r0c0"]),
      activeGapPath: null,
      clipboard: null,
      editing: false,
      shrinkToText: true,
      showGridLines: true,
      enterNextCell: true,
      enterAddCellAtEnd: true,
      enterAddSibling: true,
      navigateFutureEdgeCells: true,
      helpPanelOpen: true,
      globalPadding: 3,
      fixedColumnWidths: {},
      maxTextboxWidth: 480,
      maxTextboxWidthEntireTree: false,
      columnMaxTextboxWidths: {},
      theme: "dark",
      compactGaps: true,
      history: [],
      redoStack: [],
      dragMode: "move",
      treeScale: 100,
      fontSize: 12,
      menuWidth: 224,
      helpWidth: 320,
      exportSettingsToo: true,
      toolbarPosition: null
    };

    const workspace = document.querySelector("#workspace");
    const treeScale = document.querySelector("#tree-scale");
    const gridRoot = document.querySelector("#grid-root");
    const helpPanel = document.querySelector("#help-panel");
    const toolbar = document.querySelector("#toolbar");
    const footer = document.querySelector("#footer");

    function emptyCell() {
      return { text: "", subgrid: null, childrenHidden: false };
    }

    function emptyGrid() {
      return { rows: [{ cells: [emptyCell()] }] };
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function cellPath(prefix, row, column) {
      return `${prefix}_r${row}c${column}`;
    }

    function parseCellPath(path) {
      const match = path.match(/^(.*)_r(\d+)c(\d+)$/);
      return match ? { prefix: match[1], row: Number(match[2]), column: Number(match[3]) } : null;
    }

    function getCell(path, grid = state.root, prefix = "root") {
      for (let row = 0; row < grid.rows.length; row++) {
        for (let column = 0; column < grid.rows[row].cells.length; column++) {
          const cell = grid.rows[row].cells[column];
          const currentPath = cellPath(prefix, row, column);
          if (currentPath === path) return cell;
          if (cell.subgrid && path.startsWith(currentPath)) {
            const nested = getCell(path, cell.subgrid, currentPath);
            if (nested) return nested;
          }
        }
      }
      return null;
    }

    function findGrid(path, grid = state.root, prefix = "root", owner = null, ownerPath = null) {
      for (let row = 0; row < grid.rows.length; row++) {
        for (let column = 0; column < grid.rows[row].cells.length; column++) {
          const cell = grid.rows[row].cells[column];
          const currentPath = cellPath(prefix, row, column);
          if (currentPath === path) return { grid, owner, ownerPath };
          if (cell.subgrid && path.startsWith(currentPath)) {
            const nested = findGrid(path, cell.subgrid, currentPath, cell, currentPath);
            if (nested) return nested;
          }
        }
      }
      return null;
    }

    function pathsInGrid(grid = state.root, prefix = "root") {
      const paths = [];
      grid.rows.forEach((row, rowIndex) => {
        row.cells.forEach((cell, columnIndex) => {
          const path = cellPath(prefix, rowIndex, columnIndex);
          paths.push(path);
          if (cell.subgrid && !cell.childrenHidden) paths.push(...pathsInGrid(cell.subgrid, path));
        });
      });
      return paths;
    }

    function rangeSelection(start, end) {
      const first = parseCellPath(start);
      const last = parseCellPath(end);
      if (!first || !last || first.prefix !== last.prefix) return new Set([start, end]);
      const paths = new Set();
      for (let row = Math.min(first.row, last.row); row <= Math.max(first.row, last.row); row++) {
        for (let column = Math.min(first.column, last.column); column <= Math.max(first.column, last.column); column++) {
          paths.add(cellPath(first.prefix, row, column));
        }
      }
      return paths;
    }

    function saveState() {
      state.history.push(JSON.stringify(state.root));
      if (state.history.length > 50) state.history.shift();
      state.redoStack = [];
    }

    function undo() {
      if (!state.history.length) return;
      state.redoStack.push(JSON.stringify(state.root));
      state.root = JSON.parse(state.history.pop());
      render();
    }

    function redo() {
      if (!state.redoStack.length) return;
      state.history.push(JSON.stringify(state.root));
      state.root = JSON.parse(state.redoStack.pop());
      render();
    }

    function setActive(path, extendSelection = false) {
      state.activePath = path;
      state.activeGapPath = null;
      state.editing = false;
      state.selectedPaths = extendSelection
        ? new Set([...state.selectedPaths, path])
        : new Set([path]);
    }

    function selectCell(path, extendSelection) {
      if (!extendSelection && state.activePath === path && state.selectedPaths.size === 1 && state.selectedPaths.has(path) && !state.editing && !state.activeGapPath) {
        return;
      }
      if (extendSelection) state.selectedPaths = rangeSelection(state.activePath, path);
      else state.selectedPaths = new Set([path]);
      state.activePath = path;
      state.activeGapPath = null;
      state.editing = false;
      render();
    }

    function moveLinear(direction, extendSelection = false) {
      const paths = pathsInGrid();
      const index = paths.indexOf(state.activePath);
      if (index < 0) return;
      const next = Math.max(0, Math.min(paths.length - 1, index + direction));
      setActive(paths[next], extendSelection);
      render();
    }

    function moveByCell(rowDelta, columnDelta) {
      const parsed = parseCellPath(state.activePath);
      const info = findGrid(state.activePath);
      if (!parsed || !info) return;
      const row = Math.max(0, Math.min(info.grid.rows.length - 1, parsed.row + rowDelta));
      const columnCount = info.grid.rows[0]?.cells.length || 1;
      const column = Math.max(0, Math.min(columnCount - 1, parsed.column + columnDelta));
      setActive(cellPath(parsed.prefix, row, column));
      render();
    }

    function moveThroughGap(key) {
      const rowGap = state.activeGapPath?.match(/^(.*)_gap(\d+)$/);
      const columnGap = state.activeGapPath?.match(/^(.*)_r(\d+)_colgap(\d+)$/);

      if (rowGap && (key === "ArrowUp" || key === "ArrowDown")) {
        const grid = rowGap[1] === "root" ? state.root : getCell(rowGap[1])?.subgrid;
        const row = Number(rowGap[2]) + (key === "ArrowUp" ? -1 : 0);
        if (grid && row >= 0 && row < grid.rows.length) {
          setActive(cellPath(rowGap[1], row, 0));
          render();
        }
        return true;
      }

      if (columnGap && (key === "ArrowLeft" || key === "ArrowRight")) {
        const grid = columnGap[1] === "root" ? state.root : getCell(columnGap[1])?.subgrid;
        const column = Number(columnGap[3]) + (key === "ArrowLeft" ? -1 : 0);
        const count = grid?.rows[0]?.cells.length || 0;
        if (grid && column >= 0 && column < count) {
          setActive(cellPath(columnGap[1], Number(columnGap[2]), column));
          render();
        }
        return true;
      }

      const current = parseCellPath(state.activePath);
      if (!current) return false;
      if (key === "ArrowUp" || key === "ArrowDown") {
        const gapIndex = current.row + (key === "ArrowDown" ? 1 : 0);
        state.activeGapPath = `${current.prefix}_gap${gapIndex}`;
      } else if (key === "ArrowLeft" || key === "ArrowRight") {
        const gapIndex = current.column + (key === "ArrowRight" ? 1 : 0);
        state.activeGapPath = `${current.prefix}_r${current.row}_colgap${gapIndex}`;
      } else {
        return false;
      }
      render();
      return true;
    }

    function moveToParent() {
      const parsed = parseCellPath(state.activePath);
      if (!parsed || parsed.row !== 0 || parsed.prefix === "root") return false;
      setActive(parsed.prefix);
      render();
      return true;
    }

    function enterChild() {
      const cell = getCell(state.activePath);
      if (!cell?.subgrid || cell.childrenHidden) return false;
      const childPath = cellPath(state.activePath, 0, 0);
      if (!getCell(childPath)) return false;
      setActive(childPath);
      render();
      return true;
    }

    function editActiveCell() {
      if (!getCell(state.activePath)) return;
      saveState();
      state.editing = true;
      render();
      const editor = document.querySelector("#active-editor");
      if (editor) {
        editor.focus();
        editor.setSelectionRange(editor.value.length, editor.value.length);
      }
    }

    function commitEditor(editor) {
      const cell = getCell(state.activePath);
      if (cell) cell.text = editor.value;
      state.editing = false;
    }

    function notifyTextChange(editor) {
      const cell = getCell(state.activePath);
      if (cell) cell.text = editor.value;
      editor.style.height = "auto";
      editor.style.height = `${Math.max(38, editor.scrollHeight)}px`;
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function makeButton(label, action, className = "") {
      const button = makeElement("button", className, label);
      button.type = "button";
      button.addEventListener("click", action);
      return button;
    }

    function makeGap(prefix, index) {
      const path = `${prefix}_gap${index}`;
      const gap = makeElement("div", `gap${state.activeGapPath === path ? " active" : ""}`);
      gap.tabIndex = 0;
      gap.title = "Select row gap; press Enter to insert a row";
      gap.addEventListener("click", () => {
        state.activeGapPath = path;
        render();
      });
      return gap;
    }

    function gapShadow(prefix, row, column) {
      if (!state.activeGapPath) return "";
      const rowGap = state.activeGapPath.match(/^(.*)_gap(\d+)$/);
      if (rowGap && rowGap[1] === prefix) {
        const index = Number(rowGap[2]);
        if (index === row) return "inset 0 3px 0 #3b82f6";
        if (index === row + 1) return "inset 0 -3px 0 #3b82f6";
      }
      const colGap = state.activeGapPath.match(/^(.*)_r(\d+)_colgap(\d+)$/);
      if (colGap && colGap[1] === prefix && Number(colGap[2]) === row) {
        const index = Number(colGap[3]);
        if (index === column) return "inset 3px 0 0 #3b82f6";
        if (index === column + 1) return "inset -3px 0 0 #3b82f6";
      }
      return "";
    }

    function renderGrid(grid, prefix = "root", isRoot = false) {
      const container = makeElement("div", `grid${isRoot ? "" : " child-grid"}`);
      const columns = Math.max(1, grid.rows[0]?.cells.length || 1);
      container.style.gridTemplateColumns = Array.from({ length: columns }, (_, column) => {
        const width = state.fixedColumnWidths[`${prefix}|${column}`];
        if (Number.isFinite(width)) return `minmax(0, ${width}px)`;
        return state.shrinkToText ? "max-content" : "minmax(140px, max-content)";
      }).join(" ");
      container.style.setProperty("--gap-v", `${Math.round(state.globalPadding * 0.75)}px`);
      container.style.setProperty("--gap-h", `${state.globalPadding}px`);
      if (!isRoot) container.style.padding = `${Math.max(0, Math.min(6, state.globalPadding))}px`;

      if (!state.compactGaps || state.activeGapPath === `${prefix}_gap0`) container.append(makeGap(prefix, 0));
      grid.rows.forEach((row, rowIndex) => {
        row.cells.forEach((cell, columnIndex) => {
          container.append(renderCell(cell, cellPath(prefix, rowIndex, columnIndex), prefix, rowIndex, columnIndex));
        });
        if (!state.compactGaps || state.activeGapPath === `${prefix}_gap${rowIndex + 1}`) {
          container.append(makeGap(prefix, rowIndex + 1));
        }
      });
      return container;
    }

    function renderCell(cell, path, prefix, row, column) {
      const active = state.activePath === path;
      const selected = state.selectedPaths.has(path);
      const element = makeElement("div", "cell");
      element.dataset.path = path;
      element.tabIndex = 0;
      element.draggable = true;
      element.style.setProperty("--cell-pad-v", `${Math.round(state.globalPadding * 0.75)}px`);
      element.style.setProperty("--cell-pad-h", `${state.globalPadding}px`);
      element.style.fontSize = `${state.fontSize}px`;
      const maxTextboxWidth = getMaxTextboxWidth(prefix, column);
      if (maxTextboxWidth) element.style.setProperty("--textbox-max-width", `${maxTextboxWidth}px`);
      if (!state.shrinkToText) element.style.minHeight = `${Math.max(28, state.globalPadding * 6 + 12)}px`;
      if (active) element.classList.add("active");
      if (selected && !active) element.classList.add("selected");
      if (!state.showGridLines) element.classList.add("no-grid-lines");
      const shadow = gapShadow(prefix, row, column);
      if (shadow) element.style.boxShadow = shadow;

      if (active && state.editing) {
        const editor = makeElement("textarea");
        editor.id = "active-editor";
        editor.value = cell.text || "";
        editor.style.fontSize = `${state.fontSize}px`;
        editor.addEventListener("input", () => notifyTextChange(editor));
        editor.addEventListener("keydown", handleEditorKeydown);
        editor.addEventListener("blur", () => {
          if (state.editing) {
            state.editing = false;
            setTimeout(render, 0);
          }
        });
        element.append(editor);
      } else {
        element.append(makeElement("div", "cell-text", cell.text || ""));
      }

      if (cell.subgrid && cell.childrenHidden) {
        const marker = makeElement("span", "hidden-marker");
        marker.title = "Children hidden (H)";
        element.append(marker);
      } else if (cell.subgrid) {
        element.append(renderGrid(cell.subgrid, path));
      }

      return element;
    }

    function renderHelpPanel() {
      helpPanel.hidden = !state.helpPanelOpen;
      if (!state.helpPanelOpen) return;
      helpPanel.style.width = `${state.helpWidth}px`;
      helpPanel.replaceChildren();
      const heading = makeElement("div", "panel-heading");
      heading.append(makeElement("span", "", "âŒ˜  Commands Help"));
      heading.append(makeButton("Close", () => { state.helpPanelOpen = false; render(); }));
      helpPanel.append(heading);

      const content = makeElement("div", "help-content");
      const sections = [
        ["Navigation & Edit", [["Arrow Keys", "Move focus"], ["Enter / Shift+Enter", "Next / previous cell while editing"], ["Shift + Click", "Select a range"], ["Double-Click", "Edit cell text"], ["Esc", "Leave edit mode"]]],
        ["Hierarchy & Structure", [["H", "Hide or show children"], ["I", "Toggle sub-grid"], ["T", "Transpose child grid"], ["P", "Add a parent cell"], ["Ctrl+P", "Add a parent to the table"]]],
        ["Clipboard & Drag", [["Drag", "Move cells"], ["X + Drag", "Cut and drop"], ["C + Drag", "Copy and drop"], ["Ctrl+C / Ctrl+V", "Copy and paste"]]],
        ["Simple Text Import & Export", [["Import Simple / Export Simple", "One cell per line. Indent children with tabs or spaces using a consistent width."], ["Example", "Plan\\n  Build\\n  Test imports Build and Test as children of Plan."], ["Line breaks", "Write \\n inside a line to preserve a cell's line break."]]]

      header.addEventListener("mousedown", event => {

        const start = { x: event.clientX, y: event.clientY, left: bounds.left, top: bounds.top };
        function move(moveEvent) {
          state.toolbarPosition = {
            left: Math.max(0, Math.min(window.innerWidth - 100, start.left + moveEvent.clientX - start.x)),
            top: Math.max(0, Math.min(window.innerHeight - 100, start.top + moveEvent.clientY - start.y))
          };
          toolbar.style.left = `${state.toolbarPosition.left}px`;
          toolbar.style.top = `${state.toolbarPosition.top}px`;
          toolbar.style.right = "auto";
        }
        function stop() {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", stop);

        toolSection("Drag action", [buttonRow([

          sliderControl("Menu width", state.menuWidth, "px", 180, 400, 10, value => { state.menuWidth = value; toolbar.style.width = `${value}px`; }),
          sliderControl("Help width", state.helpWidth, "px", 200, 500, 10, value => { state.helpWidth = value; helpPanel.style.width = `${value}px`; toolbar.style.right = `${state.helpPanelOpen ? value : 0}px`; }),

    function toolSection(title, children) {
      const section = makeElement("section", "tool-section");
      section.append(makeElement("div", "section-title", title));
      children.forEach(child => section.append(child));
      return section;
    }

    function buttonRow(buttons, three = false) {
      const row = makeElement("div", `button-row${three ? " three" : ""}`);
      buttons.forEach(button => row.append(button));
      return row;
    }

    function checkControl(label, checked, onChange, id = "") {
      const wrapper = makeElement("label");
      const input = makeElement("input");
      input.type = "checkbox";
      if (id) input.id = id;
      input.checked = checked;
      input.addEventListener("change", () => onChange(input.checked));
      wrapper.append(input, document.createTextNode(label));
      return wrapper;
    }

    function sliderControl(label, value, unit, min, max, step, onChange) {
      const wrapper = makeElement("label", "slider-control");
      const line = makeElement("span", "slider-label");
      const output = makeElement("strong", "", `${value}${unit}`);
      line.append(document.createTextNode(label), output);
      const input = makeElement("input");
      input.type = "range";
      input.min = min;
      input.max = max;
      input.step = step;
      input.value = value;
      input.addEventListener("input", () => {
        const next = Number(input.value);
        output.textContent = `${next}${unit}`;
        onChange(next);
      });
      wrapper.append(line, input);
      return wrapper;
    }

    function numberControl(label, value, min, max, step, onChange) {
      const wrapper = makeElement("div", "slider-control");
      const line = makeElement("span", "slider-label", label);
      const buttons = buttonRow([
        makeButton("âˆ’", () => onChange(Math.max(min, value - step))),
        makeElement("strong", "", `${value}px`),
        makeButton("+", () => onChange(Math.min(max, value + step)))
      ], true);
      line.append(buttons);
      wrapper.append(line);
      return wrapper;
    }

    function fileControl(label, onFile, accept = ".json,application/json") {
      const wrapper = makeElement("label", "file-button", label);
      const input = makeElement("input");
      input.type = "file";
      input.accept = accept;
      input.addEventListener("change", () => {
        if (input.files?.[0]) onFile(input.files[0]);
        input.value = "";
      });
      wrapper.append(input);
      return wrapper;
    }

    function selectControl(label, value, options, onChange) {
      const wrapper = makeElement("label", "slider-control");
      wrapper.append(makeElement("span", "slider-label", label));
      const select = makeElement("select");
      options.forEach(([optionValue, text]) => {
        const option = makeElement("option", "", text);
        option.value = optionValue;
        option.selected = optionValue === value;
        select.append(option);
      });
      select.addEventListener("change", () => onChange(select.value));
      wrapper.append(select);
      return wrapper;
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
    }

    function applyTreeScale() {
      treeScale.style.transform = `scale(${state.treeScale / 100})`;
    }

    function activeColumnWidthKey() {
      const parsed = parseCellPath(state.activePath);
      return parsed ? `${parsed.prefix}|${parsed.column}` : null;
    }

    function getMaxTextboxWidth(prefix, column) {
      if (state.maxTextboxWidthEntireTree) return state.maxTextboxWidth;
      return state.columnMaxTextboxWidths[`${prefix}|${column}`] ?? state.maxTextboxWidth;
    }

    function setActiveColumnFixed(fixed, width) {
      const key = activeColumnWidthKey();
      if (!key) return;
      if (fixed) state.fixedColumnWidths[key] = width;
      else delete state.fixedColumnWidths[key];
      renderGridOnly();
    }

    function setActiveColumnWidth(width) {
      const key = activeColumnWidthKey();
      if (!key) return;
      state.fixedColumnWidths[key] = width;
      const checkbox = toolbar.querySelector("#fixed-column-width-toggle");
      if (checkbox) checkbox.checked = true;
      renderGridOnly();
    }

    function setMaxTextboxWidth(width) {
      const key = activeColumnWidthKey();
      if (state.maxTextboxWidthEntireTree) {
        state.maxTextboxWidth = width;
      } else if (key) {
        state.columnMaxTextboxWidths[key] = width;
      }
      renderGridOnly();
    }

    function setMaxTextboxWidthEntireTree(enabled) {
      const key = activeColumnWidthKey();
      if (enabled && key && state.columnMaxTextboxWidths[key] !== undefined) {
        state.maxTextboxWidth = state.columnMaxTextboxWidths[key];
      } else if (!enabled && key) {
        state.columnMaxTextboxWidths[key] = state.maxTextboxWidth;
      }
      state.maxTextboxWidthEntireTree = enabled;
      render();
    }

    function renderGridOnly() {
      gridRoot.replaceChildren(renderGrid(state.root, "root", true));
      applyTreeScale();
    }

    function renderFooter() {
      footer.replaceChildren();
      footer.append(makeElement("span", "", "Arrow keys: move | Shift+Click: select range | Drag: move | X: cut | C: copy"));
      const label = state.dragMode === "cut" ? "Mode: Cut & Drop" : state.dragMode === "copy" ? "Mode: Copy & Drop" : "Mode: Move";
      footer.append(makeElement("span", `mode-indicator ${state.dragMode}`, label));
    }

    function render() {
      applyTheme();
      renderGridOnly();
      renderHelpPanel();
      renderToolbar();
      renderFooter();
      toolbar.querySelectorAll("button").forEach(button => {
        if (button.textContent === "Undo") button.disabled = state.history.length === 0;
        if (button.textContent === "Redo") button.disabled = state.redoStack.length === 0;
      });
      if (state.editing) {
        const editor = document.querySelector("#active-editor");
        if (editor) {
          editor.focus();
          editor.setSelectionRange(editor.value.length, editor.value.length);
        }
      }
    }

    function setDragMode(mode) {
      state.dragMode = mode;
      render();
    }

    function hasSubgrid() {
      return Boolean(getCell(state.activePath)?.subgrid);
    }

    function clearCell() {
      saveState();
      [...state.selectedPaths].forEach(path => {
        const cell = getCell(path);
        const parsed = parseCellPath(path);
        if (!cell || !parsed) return;
        if (cell.text) {
          cell.text = "";
          return;
        }
        const info = findGrid(path);
        if (!info) return;
        if (info.grid.rows[parsed.row].cells.length > 1) {
          info.grid.rows[parsed.row].cells.splice(parsed.column, 1);
          state.activePath = cellPath(parsed.prefix, parsed.row, Math.max(0, parsed.column - 1));
        } else if (info.grid.rows.length > 1) {
          info.grid.rows.splice(parsed.row, 1);
          state.activePath = cellPath(parsed.prefix, Math.max(0, parsed.row - 1), 0);
        } else {
          info.grid.rows[0].cells[0] = emptyCell();
          state.activePath = cellPath(parsed.prefix, 0, 0);
        }
      });
      state.selectedPaths = new Set([state.activePath]);
      state.editing = false;
      render();
    }

    function addRow() {
      const info = findGrid(state.activePath);
      if (!info) return;
      saveState();
      const columns = info.grid.rows[0]?.cells.length || 1;
      info.grid.rows.push({ cells: Array.from({ length: columns }, emptyCell) });
      render();
    }

    function addColumn() {
      const info = findGrid(state.activePath);
      if (!info) return;
      saveState();
      info.grid.rows.forEach(row => row.cells.push(emptyCell()));
      render();
    }

    function deleteRow() {
      const info = findGrid(state.activePath);
      const parsed = parseCellPath(state.activePath);
      if (!info || !parsed || info.grid.rows.length < 2) return;
      saveState();
      info.grid.rows.splice(parsed.row, 1);
      state.activePath = cellPath(parsed.prefix, Math.max(0, parsed.row - 1), 0);
      state.selectedPaths = new Set([state.activePath]);
      render();
    }

    function deleteColumn() {
      const info = findGrid(state.activePath);
      const parsed = parseCellPath(state.activePath);
      if (!info || !parsed || info.grid.rows[0].cells.length < 2) return;
      saveState();
      info.grid.rows.forEach(row => row.cells.splice(parsed.column, 1));
      state.activePath = cellPath(parsed.prefix, 0, Math.max(0, parsed.column - 1));
      state.selectedPaths = new Set([state.activePath]);
      render();
    }

    function toggleNest() {
      const cell = getCell(state.activePath);
      if (!cell) return;
      saveState();
      if (cell.subgrid) {
        if (confirm("Remove this sub-grid?")) cell.subgrid = null;
      } else {
        cell.subgrid = emptyGrid();
        state.activePath = cellPath(state.activePath, 0, 0);
        state.selectedPaths = new Set([state.activePath]);
      }
      state.editing = false;
      render();
    }

    function transposeGrid() {
      const cell = getCell(state.activePath);
      if (!cell?.subgrid) {
        alert("No child grid found.");
        return;
      }
      saveState();
      const grid = cell.subgrid;
      const rows = grid.rows.length;
      const columns = grid.rows[0].cells.length;
      grid.rows = Array.from({ length: columns }, (_, column) => ({
        cells: Array.from({ length: rows }, (_, row) => grid.rows[row].cells[column] || emptyCell())
      }));
      render();
    }

    function addParent() {
      const info = findGrid(state.activePath);
      if (!info) return;
      saveState();
      if (info.owner) {
        info.owner.subgrid = { rows: [{ cells: [{ text: "", subgrid: info.owner.subgrid, childrenHidden: false }] }] };
        state.activePath = info.ownerPath;
      } else {
        state.root = { rows: [{ cells: [{ text: "", subgrid: state.root, childrenHidden: false }] }] };
        state.activePath = "root_r0c0";
      }
      state.selectedPaths = new Set([state.activePath]);
      state.editing = false;
      render();
    }

    function addParentToCell() {
      const info = findGrid(state.activePath);
      const parsed = parseCellPath(state.activePath);
      if (!info || !parsed) return;
      saveState();
      const oldCell = info.grid.rows[parsed.row].cells[parsed.column];
      info.grid.rows[parsed.row].cells[parsed.column] = { text: "", subgrid: { rows: [{ cells: [oldCell] }] }, childrenHidden: false };
      state.editing = false;
      render();
    }

    function toggleChildren() {
      const cell = getCell(state.activePath);
      if (!cell?.subgrid) return;
      saveState();
      cell.childrenHidden = !cell.childrenHidden;
      render();
    }

    function pruneGrid(grid) {
      grid.rows = grid.rows.filter(row => !row.cells.every(cell => !cell.text && !cell.subgrid));
      if (!grid.rows.length) grid.rows.push({ cells: [emptyCell()] });
      const count = grid.rows[0].cells.length;
      const keep = new Set();
      grid.rows.forEach(row => row.cells.forEach((cell, column) => {
        if (cell.text || cell.subgrid) keep.add(column);
      }));
      if (!keep.size) keep.add(0);
      if (keep.size < count) grid.rows.forEach(row => { row.cells = row.cells.filter((cell, index) => keep.has(index)); });
      grid.rows.forEach(row => row.cells.forEach(cell => { if (cell.subgrid) pruneGrid(cell.subgrid); }));
    }

    function pruneCurrentGrid() {
      const info = findGrid(state.activePath);
      if (!info) return;
      saveState();
      pruneGrid(info.grid);
      state.activePath = "root_r0c0";
      state.selectedPaths = new Set([state.activePath]);
      render();
    }

    function pruneTree() {
      saveState();
      pruneGrid(state.root);
      state.activePath = "root_r0c0";
      state.selectedPaths = new Set([state.activePath]);
      render();
    }

    function handleDrop(targetPath, draggedPaths, dropMode, payloadMode) {
      if (draggedPaths.includes(targetPath)) return;
      const draggedCells = draggedPaths.map(path => getCell(path)).filter(Boolean).map(clone);
      if (!draggedCells.length) return;
      saveState();
      const target = getCell(targetPath);
      const info = findGrid(targetPath);
      const parsed = parseCellPath(targetPath);
      const cut = state.dragMode === "cut" || payloadMode === "cut";

      if (dropMode === "child" && target) {
        if (!target.subgrid) target.subgrid = { rows: [] };
        target.subgrid.rows.push({ cells: draggedCells });
        target.childrenHidden = false;
      } else if ((dropMode === "row-before" || dropMode === "row-after") && info && parsed) {
        const index = parsed.row + (dropMode === "row-after" ? 1 : 0);
        info.grid.rows.splice(index, 0, { cells: draggedCells });
      } else if ((dropMode === "col-before" || dropMode === "col-after") && info && parsed) {
        const index = parsed.column + (dropMode === "col-after" ? 1 : 0);
        draggedCells.forEach((cell, offset) => {
          const row = info.grid.rows[parsed.row + offset];
          if (row) row.cells.splice(index, 0, cell);
          else info.grid.rows.push({ cells: [cell] });
        });
      }

      if (cut || state.dragMode === "move") {
        draggedPaths.forEach(path => {
          const cell = getCell(path);
          if (cell) Object.assign(cell, emptyCell());
        });
      }
      state.activePath = targetPath;
      state.selectedPaths = new Set([targetPath]);
      state.activeGapPath = null;
      state.editing = false;
      render();
    }

    function insertRowAtGap(path) {
      const match = path.match(/^(.*)_gap(\d+)$/);
      if (!match) return;
      const prefix = match[1];
      const info = prefix === "root" ? { grid: state.root } : { grid: getCell(prefix)?.subgrid };
      if (!info.grid) return;
      saveState();
      const count = info.grid.rows[0]?.cells.length || 1;
      const index = Number(match[2]);
      info.grid.rows.splice(index, 0, { cells: Array.from({ length: count }, emptyCell) });
      state.activePath = cellPath(prefix, index, 0);
      state.selectedPaths = new Set([state.activePath]);
      state.activeGapPath = null;
      state.editing = true;
      render();
    }

    function insertColumnAtGap(path) {
      const match = path.match(/^(.*)_r(\d+)_colgap(\d+)$/);
      if (!match) return;
      const prefix = match[1];
      const info = prefix === "root" ? { grid: state.root } : { grid: getCell(prefix)?.subgrid };
      if (!info.grid) return;
      saveState();
      const column = Number(match[3]);
      info.grid.rows.forEach(row => row.cells.splice(column, 0, emptyCell()));
      state.activePath = cellPath(prefix, Number(match[2]), column);
      state.selectedPaths = new Set([state.activePath]);
      state.activeGapPath = null;
      state.editing = true;
      render();
    }

    function copySelection() {
      state.clipboard = [...state.selectedPaths].map(path => ({ path, cell: getCell(path) })).filter(item => item.cell).map(item => ({ path: item.path, cell: clone(item.cell) }));
      navigator.clipboard?.writeText(state.clipboard.map(item => item.cell.text || "").join("\n")).catch(() => {});
    }

    function pasteSelection() {
      if (!state.clipboard?.length) return;
      saveState();
      [...state.selectedPaths].forEach((path, index) => {
        const target = getCell(path);
        const source = state.clipboard[index % state.clipboard.length]?.cell;
        if (target && source) Object.assign(target, clone(source));
      });
      render();
    }

    function exportFile(name, data, contentType = "application/json") {
      const content = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      const blob = new Blob([content], { type: contentType });
      const link = makeElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function settingsData() {
      return {
        treeScale: state.treeScale,
        fontSize: state.fontSize,
        menuWidth: state.menuWidth,
        helpWidth: state.helpWidth,
        globalPadding: state.globalPadding,
        fixedColumnWidths: state.fixedColumnWidths,
        maxTextboxWidth: state.maxTextboxWidth,
        maxTextboxWidthEntireTree: state.maxTextboxWidthEntireTree,
        columnMaxTextboxWidths: state.columnMaxTextboxWidths,
        lightMode: state.theme === "light",
        blackMode: state.theme === "black",
        showGridLines: state.showGridLines,
        enterNextCell: state.enterNextCell,
        enterAddCellAtEnd: state.enterAddCellAtEnd,
        enterAddSibling: state.enterAddSibling,
        navigateFutureEdgeCells: state.navigateFutureEdgeCells,
        helpPanelOpen: state.helpPanelOpen,
        compactGaps: state.compactGaps
      };
    }

    function exportProject() {
      exportFile("treesheets_project.json", state.root);
      if (state.exportSettingsToo) exportFile("treesheets_settings.json", settingsData());
    }

    function encodeSimpleText(text) {
      return text.replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n");
    }

    function decodeSimpleText(text) {
      let decoded = "";
      for (let index = 0; index < text.length; index++) {
        if (text[index] === "\\" && index + 1 < text.length) {
          const next = text[index + 1];
          if (next === "n") {
            decoded += "\n";
            index++;
            continue;
          }
          if (next === "\\") {
            decoded += "\\";
            index++;
            continue;
          }
        }
        decoded += text[index];
      }
      return decoded;
    }

    function exportSimple() {
      const lines = [];
      function appendGrid(grid, depth) {
        grid.rows.forEach(row => row.cells.forEach(cell => {
          if (cell.text) lines.push(`${"\t".repeat(depth)}${encodeSimpleText(cell.text)}`);
          if (cell.subgrid) appendGrid(cell.subgrid, cell.text ? depth + 1 : depth);
        }));
      }
      appendGrid(state.root, 0);
      exportFile("treesheets_outline.txt", lines.join("\n") + "\n", "text/plain;charset=utf-8");
    }

    function importSimple(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const records = String(reader.result || "").split(/\r?\n/)
          .map(line => {
            const indentation = line.match(/^[\t ]*/)[0];
            return { indentation, text: line.slice(indentation.length) };
          })
          .filter(record => record.text.length > 0);

        if (!records.length) {
          alert("The simple outline file has no cells.");
          return;
        }

        const indentWidths = records
          .filter(record => record.indentation.length > 0)
          .map(record => [...record.indentation].reduce((width, character) => width + (character === "\t" ? 2 : 1), 0));
        const indentUnit = Math.min(...indentWidths.filter(width => width > 0)) || 1;
        const roots = [];
        const parents = [];

        records.forEach(record => {
          const indentWidth = [...record.indentation].reduce((width, character) => width + (character === "\t" ? 2 : 1), 0);
          const requestedDepth = Math.floor(indentWidth / indentUnit);
          const depth = Math.min(requestedDepth, parents.length);
          const cell = { text: decodeSimpleText(record.text), subgrid: null, childrenHidden: false };

          if (depth === 0) {
            roots.push(cell);
          } else {
            const parent = parents[depth - 1];
            if (!parent.subgrid) parent.subgrid = { rows: [] };
            parent.subgrid.rows.push({ cells: [cell] });
          }

          parents[depth] = cell;
          parents.length = depth + 1;
        });

        saveState();
        state.root = { rows: roots.map(cell => ({ cells: [cell] })) };
        state.activePath = "root_r0c0";
        state.selectedPaths = new Set([state.activePath]);
        state.activeGapPath = null;
        state.editing = false;
        render();
      };
      reader.readAsText(file, "UTF-8");
    }

    function readJson(file, callback) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          callback(JSON.parse(reader.result));
        } catch {
          alert("Could not read that JSON file.");
        }
      };
      reader.readAsText(file, "UTF-8");
    }

    function importProject(file) {
      readJson(file, data => {
        if (!data || !Array.isArray(data.rows)) {
          alert("Invalid TreeSheets project file.");
          return;
        }
        saveState();
        state.root = data;
        state.activePath = "root_r0c0";
        state.selectedPaths = new Set([state.activePath]);
        state.editing = false;
        render();
      });
    }

    function importSettings(file) {
      readJson(file, settings => {
        if (!settings || typeof settings !== "object") {
          alert("Invalid settings file.");
          return;
        }
        for (const key of ["treeScale", "menuWidth", "helpWidth", "globalPadding"]) {
          if (typeof settings[key] === "number") state[key] = settings[key];
        }
        if (settings.fixedColumnWidths && typeof settings.fixedColumnWidths === "object") {
          state.fixedColumnWidths = Object.fromEntries(
            Object.entries(settings.fixedColumnWidths)
              .filter(([, width]) => typeof width === "number" && Number.isFinite(width))
              .map(([key, width]) => [key, Math.max(60, Math.min(480, width))])
          );
        }
        if (typeof settings.maxTextboxWidth === "number" && Number.isFinite(settings.maxTextboxWidth)) {
          state.maxTextboxWidth = Math.max(60, Math.min(1200, settings.maxTextboxWidth));
        }
        if (typeof settings.maxTextboxWidthEntireTree === "boolean") {
          state.maxTextboxWidthEntireTree = settings.maxTextboxWidthEntireTree;
        }
        if (settings.columnMaxTextboxWidths && typeof settings.columnMaxTextboxWidths === "object") {
          state.columnMaxTextboxWidths = Object.fromEntries(
            Object.entries(settings.columnMaxTextboxWidths)
              .filter(([, width]) => typeof width === "number" && Number.isFinite(width))
              .map(([key, width]) => [key, Math.max(60, Math.min(1200, width))])
          );
        }
        if (typeof settings.fontSize === "number") state.fontSize = Math.max(8, Math.min(32, settings.fontSize));
        if (typeof settings.lightMode === "boolean" || typeof settings.blackMode === "boolean") {
          state.theme = settings.blackMode ? "black" : settings.lightMode ? "light" : "dark";
        }
        if (typeof settings.showGridLines === "boolean") state.showGridLines = settings.showGridLines;
        if (typeof settings.enterNextCell === "boolean") state.enterNextCell = settings.enterNextCell;
        if (typeof settings.enterAddCellAtEnd === "boolean") state.enterAddCellAtEnd = settings.enterAddCellAtEnd;
        if (typeof settings.enterAddSibling === "boolean") state.enterAddSibling = settings.enterAddSibling;
        if (typeof settings.navigateFutureEdgeCells === "boolean") state.navigateFutureEdgeCells = settings.navigateFutureEdgeCells;
        if (typeof settings.helpPanelOpen === "boolean") state.helpPanelOpen = settings.helpPanelOpen;
        if (typeof settings.compactGaps === "boolean") state.compactGaps = settings.compactGaps;
        render();
      });
    }

    function newSheet() {
      if (!confirm("Create a new blank TreeSheets project?")) return;
      saveState();
      state.root = emptyGrid();
      state.activePath = "root_r0c0";
      state.selectedPaths = new Set([state.activePath]);
      state.editing = false;
      render();
    }

    function handleEditorKeydown(event) {
      if (event.key === "Escape") {
        event.preventDefault();
        commitEditor(event.currentTarget);
        render();
        return;
      }
      if (event.key !== "Enter") return;
      const editor = event.currentTarget;
      const paths = pathsInGrid();
      const index = paths.indexOf(state.activePath);

      if (state.enterAddSibling && !event.shiftKey) {
        event.preventDefault();
        const info = findGrid(state.activePath);
        const parsed = parseCellPath(state.activePath);
        if (info && parsed) {
          saveState();
          const columns = info.grid.rows[0]?.cells.length || 1;
          info.grid.rows.splice(parsed.row + 1, 0, { cells: Array.from({ length: columns }, emptyCell) });
          saveState();
          state.activePath = cellPath(parsed.prefix, parsed.row + 1, parsed.column);
          state.selectedPaths = new Set([state.activePath]);
          state.editing = true;
          render();
        }
        return;
      }

      if (state.enterNextCell && !event.shiftKey) {
        event.preventDefault();
        commitEditor(editor);
        if (index >= 0 && index < paths.length - 1) {
          saveState();
          state.activePath = paths[index + 1];
          state.selectedPaths = new Set([state.activePath]);
          state.editing = true;
        } else if (state.enterAddCellAtEnd && index === paths.length - 1) {
          const info = findGrid(state.activePath);
          if (info) {
            saveState();
            const columns = info.grid.rows[0]?.cells.length || 1;
            info.grid.rows.push({ cells: Array.from({ length: columns }, emptyCell) });
            saveState();
            const allPaths = pathsInGrid();
            state.activePath = allPaths[allPaths.length - 1];
            state.selectedPaths = new Set([state.activePath]);
            state.editing = true;
          }
        }
        render();
      } else if (state.enterNextCell && event.shiftKey) {
        event.preventDefault();
        commitEditor(editor);
        if (index > 0) {
          saveState();
          state.activePath = paths[index - 1];
          state.selectedPaths = new Set([state.activePath]);
          state.editing = true;
        }
        render();
      } else if (event.ctrlKey || event.metaKey || !state.enterNextCell) {
        event.preventDefault();
        commitEditor(editor);
        render();
      }
    }

    function handleGlobalKeydown(event) {
      const isEditing = event.target instanceof HTMLTextAreaElement;
      const key = event.key.toLowerCase();
      if ((event.ctrlKey || event.metaKey) && key === "z") {
        event.preventDefault();
        event.shiftKey ? redo() : undo();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && key === "y") { event.preventDefault(); redo(); return; }
      if ((event.ctrlKey || event.metaKey) && key === "c" && !isEditing) { event.preventDefault(); copySelection(); return; }
      if ((event.ctrlKey || event.metaKey) && key === "v" && !isEditing) { event.preventDefault(); pasteSelection(); return; }
      if ((event.ctrlKey || event.metaKey) && key === "p") { event.preventDefault(); addParent(); return; }
      if (isEditing) return;

      if (state.activeGapPath) {
        if (event.key === "Enter") {
          event.preventDefault();
          state.activeGapPath.includes("_colgap") ? insertColumnAtGap(state.activeGapPath) : insertRowAtGap(state.activeGapPath);
          return;
        }
        if (event.key === "Escape") { state.activeGapPath = null; render(); return; }
      }
      if (event.key === "Delete" || event.key === "Backspace") { event.preventDefault(); clearCell(); return; }
      if (event.key === "Enter") { event.preventDefault(); editActiveCell(); return; }
      if (key === "x") { setDragMode("cut"); return; }
      if (key === "c") { setDragMode("copy"); return; }
      if (key === "h") { toggleChildren(); return; }
      if (key === "t") { transposeGrid(); return; }
      if (key === "p") { addParentToCell(); return; }
      if (key === "i") { toggleNest(); return; }
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        if (event.ctrlKey || event.metaKey) {
          if (event.key === "ArrowDown" && enterChild()) return;
          if (event.key === "ArrowUp" && moveToParent()) return;
          const direction = event.key === "ArrowUp" || event.key === "ArrowLeft" ? -1 : 1;
          moveLinear(direction, event.shiftKey);
          return;
        }
        if (state.navigateFutureEdgeCells && moveThroughGap(event.key)) return;
        moveByCell(
          event.key === "ArrowUp" ? -1 : event.key === "ArrowDown" ? 1 : 0, 
          event.key === "ArrowLeft" ? -1 : event.key === "ArrowRight" ? 1 : 0
        );
      }
    }

    // Delegated event listeners for all cell interactions
    workspace.addEventListener("mousedown", event => {
      if (event.target === workspace) workspace.focus();
      const cell = event.target.closest('.cell');
      if (cell && (event.target === cell || event.target.classList.contains("cell-text"))) {
        selectCell(cell.dataset.path, event.shiftKey);
      }
    });

    workspace.addEventListener("dblclick", event => {
      const cell = event.target.closest('.cell');
      if (cell && (event.target === cell || event.target.classList.contains("cell-text"))) {
        setActive(cell.dataset.path);
        saveState();
        state.editing = true;
        render();
        document.querySelector("#active-editor")?.focus();
      }
    });

    workspace.addEventListener("dragstart", event => {
      const cell = event.target.closest('.cell');
      if (!cell) return;
      const path = cell.dataset.path;
      if (!state.selectedPaths.has(path)) {
        state.activePath = path;
        state.selectedPaths = new Set([path]);
      }
      event.dataTransfer.setData("text/plain", JSON.stringify({ paths: [...state.selectedPaths], mode: state.dragMode }));
      event.dataTransfer.effectAllowed = state.dragMode === "copy" ? "copy" : "move";
    });

    workspace.addEventListener("dragover", event => {
      const cell = event.target.closest('.cell');
      if (!cell) return;
      event.preventDefault();
      const bounds = cell.getBoundingClientRect();
      const x = event.clientX - bounds.left;
      const y = event.clientY - bounds.top;
      let mode = "child";
      if (y < 10) mode = "row-before";
      else if (y > bounds.height - 10) mode = "row-after";
      else if (x < 10) mode = "col-before";
      else if (x > bounds.width - 10) mode = "col-after";
      cell.dataset.dropMode = mode;
      cell.classList.add("drag-target", state.dragMode);
      
      const existingEdge = cell.querySelector(".drop-edge");
      if (!existingEdge || !existingEdge.classList.contains(mode)) {
        existingEdge?.remove();
        cell.append(makeElement("span", `drop-edge ${mode}`));
      }
    });

    workspace.addEventListener("dragleave", event => {
      const cell = event.target.closest('.cell');
      if (!cell) return;
      if (event.relatedTarget && cell.contains(event.relatedTarget)) return;
      cell.classList.remove("drag-target", "move", "cut", "copy");
      cell.querySelector(".drop-edge")?.remove();
    });

    workspace.addEventListener("drop", event => {
      const cell = event.target.closest('.cell');
      if (!cell) return;
      event.preventDefault();
      cell.classList.remove("drag-target", "move", "cut", "copy");
      cell.querySelector(".drop-edge")?.remove();
      try {
        const payload = JSON.parse(event.dataTransfer.getData("text/plain"));
        handleDrop(cell.dataset.path, payload.paths, cell.dataset.dropMode || "child", payload.mode);
      } catch { }
    });

    window.addEventListener("keydown", handleGlobalKeydown);

    render();
  </script>
</body>
</html>
