    <div class="container">
        <h1>🧩 Puzzle Arcade All-Access</h1>

        <div class="login-section">
    <h3>Subscriber Login</h3>
    <input type="email" id="loginEmail" placeholder="Enter your subscriber email">
    <button onclick="loginUser()">Log In & Play</button>
    <p id="loginError" style="color: red;"></p>
</div>

<script>
    async function loginUser() {
        const email = document.getElementById('loginEmail').value;
        const errorEl = document.getElementById('loginError');
        errorEl.innerText = "Logging in...";

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await response.json();
            
            if (data.success) {
                window.location.href = 'mastermind1.html'; // Redirect to games
            } else {
                errorEl.innerText = "Error: " + (data.error || 'Login failed');
            }
        } catch (err) {
            errorEl.innerText = "Network or server error occurred.";
        }
    }
</script>
